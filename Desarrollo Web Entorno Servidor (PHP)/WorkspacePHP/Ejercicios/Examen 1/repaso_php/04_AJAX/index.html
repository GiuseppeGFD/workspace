<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Saludador AJAX</title>
</head>
<body>
    <h2>SALUDADOR AJAX</h2>
    <label>Introduce tu nombre:</label>
    <input type="text" id="nombre">
    <button onclick="saludar()">Saludar</button>
    
    <div id="resultado" style="margin-top:20px; border:1px dashed #333; padding:10px; display:none;"></div>

    <script>
        function saludar() {
            let nombre = document.getElementById('nombre').value;
            if (!nombre) return;
            
            // Peticion directa al servidor PHP
            fetch('servidor.php?nombre=' + encodeURIComponent(nombre))
                .then(response => response.text())
                .then(html => {
                    let div = document.getElementById('resultado');
                    div.innerHTML = html;
                    div.style.display = 'block';
                });
        }
    </script>
</body>
</html>
