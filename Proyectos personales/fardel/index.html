<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fardel · Tus gastos, claros</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<section id="auth" class="auth hidden">
  <div class="card auth-card">
    <h1 class="brand">Fardel</h1>
    <p class="muted" id="authSub">Entra para ver cuánto gastas y en qué.</p>
    <form id="authForm" class="stack">
      <input name="name" placeholder="Tu nombre" autocomplete="name" class="reg hidden">
      <input name="code" placeholder="Código de invitación (opcional)" maxlength="8" class="reg hidden" style="text-transform:uppercase">
      <input name="email" type="email" placeholder="Correo" autocomplete="email" required>
      <input name="password" type="password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="current-password" required minlength="8">
      <p class="error" id="authErr" role="alert"></p>
      <button class="btn primary" id="authBtn">Entrar</button>
    </form>
    <button class="link" id="authToggle">¿Primera vez? Crea tu cuenta</button>
  </div>
</section>

<div id="app" class="app hidden">
  <header class="top">
    <div class="who"><img src="assets/img/avatar.png" alt="" class="avatar"><div><b id="userName"></b><span class="muted small">Tu espacio</span></div></div>
    <div class="period">
      <div class="seg" id="seg"><button data-p="week">Semana</button><button data-p="month" class="on">Mes</button><button data-p="year">Año</button></div>
      <div class="nav"><button data-act="prev" aria-label="Anterior"><i data-lucide="chevron-left"></i></button><b id="rangeLabel"></b><button data-act="next" aria-label="Siguiente"><i data-lucide="chevron-right"></i></button></div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="csv"><i data-lucide="download"></i><span>CSV</span></button>
      <button class="btn ghost" data-act="logout" aria-label="Salir"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <main class="grid">
    <section class="hero card">
      <p class="muted">Has gastado</p>
      <h2 id="total" class="big">0,00 €</h2>
      <div class="stats">
        <div><b id="sCount">0</b><span class="muted small">movimientos</span></div>
        <div><b id="sAvg">0 €</b><span class="muted small">media diaria</span></div>
        <div><b id="sTop">—</b><span class="muted small">categoría principal</span></div>
        <div><b id="sSubs">0 €</b><span class="muted small">suscripciones/mes</span></div>
      </div>
    </section>

    <section class="card"><h3>Por categoría</h3><div class="chart"><canvas id="cPie"></canvas></div></section>
    <section class="card"><h3>Últimos 6 meses</h3><div class="chart"><canvas id="cBar"></canvas></div></section>

    <section class="card">
      <div class="row"><h3>Presupuestos</h3><button class="icon" data-act="newCat" aria-label="Nueva categoría"><i data-lucide="plus"></i></button></div>
      <div id="budgets" class="stack"></div>
    </section>

    <section class="card">
      <div class="row"><h3>Suscripciones</h3><button class="icon" data-act="newSub" aria-label="Nueva suscripción"><i data-lucide="plus"></i></button></div>
      <div id="subs" class="stack"></div>
    </section>

    <section class="card wide">
      <div class="row"><h3 id="houseName">Hogar</h3></div>
      <div id="members" class="stack"></div>
      <div id="invite" class="stack hidden" style="margin-top:10px"></div>
    </section>

    <section class="card wide">
      <div class="row"><h3>Movimientos</h3>
        <div class="filters"><input id="q" type="search" placeholder="Buscar…"><select id="fCat"></select></div></div>
      <div id="list" class="stack"></div>
    </section>
  </main>
  <button class="fab" data-act="newExp" aria-label="Nuevo gasto"><i data-lucide="plus"></i><span>Nuevo gasto</span></button>
</div>

<dialog id="dExp"><form class="stack" method="dialog" data-save="expense_save"><h3 id="dExpT">Nuevo gasto</h3>
  <input type="hidden" name="id">
  <input name="description" placeholder="Concepto (ej. Gasolina)" required maxlength="200">
  <div class="two"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Importe €" required><input name="expense_date" type="date" required></div>
  <select name="category_id" required></select>
  <input name="note" placeholder="Nota (opcional)" maxlength="500">
  <label class="file"><i data-lucide="receipt"></i><span id="fileName">Adjuntar foto del ticket</span><input type="file" name="receipt" accept="image/jpeg,image/png,image/webp" hidden></label>
  <p class="error" role="alert"></p>
  <div class="two"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Guardar gasto</button></div></form></dialog>

<dialog id="dCat"><form class="stack" method="dialog" data-save="cat_save"><h3 id="dCatT">Categoría</h3>
  <input type="hidden" name="id">
  <div class="two icon-name"><input name="icon" placeholder="🏷️" maxlength="4"><input name="name" placeholder="Nombre" required maxlength="60"></div>
  <input name="budget" type="number" step="0.01" min="0" placeholder="Presupuesto mensual € (opcional)">
  <p class="error" role="alert"></p>
  <div class="two"><button type="button" class="btn danger hidden" id="catDel">Eliminar</button><button type="button" class="btn ghost" data-close>Cancelar</button></div>
  <button class="btn primary">Guardar categoría</button></form></dialog>

<dialog id="dSub"><form class="stack" method="dialog" data-save="sub_save"><h3>Nueva suscripción</h3>
  <input name="service" placeholder="Servicio (ej. Netflix)" required maxlength="100">
  <div class="two"><input name="price" type="number" step="0.01" min="0.01" placeholder="Precio €/mes" required><input name="charge_day" type="number" min="1" max="31" placeholder="Día de cobro" required></div>
  <p class="error" role="alert"></p>
  <div class="two"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Añadir</button></div></form></dialog>

<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
