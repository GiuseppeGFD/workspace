<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fardel | Gestión de Hogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="relative min-h-screen flex">

    <div class="mesh-bg">
        <div class="blob bg-indigo-600 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
        <div class="blob bg-pink-600 w-[400px] h-[400px] bottom-[-10%] right-[-10%]" style="animation-delay: 2s;"></div>
    </div>

    <!-- Login -->
    <div id="authView" class="w-full flex items-center justify-center min-h-screen absolute inset-0 z-50">
        <div class="glass-panel p-8 w-full max-w-md">
            <h1 class="text-5xl font-black text-center mb-8 tracking-tighter">Far<span
                    class="text-indigo-500">del</span>.</h1>
            <form id="formLogin" class="space-y-4">
                <input type="email" id="logEmail" placeholder="Correo" value="admin@fardel.com" required
                    class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 outline-none focus:border-indigo-500 transition-colors">
                <input type="password" id="logPass" placeholder="Contraseña" value="admin123" required
                    class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 outline-none focus:border-indigo-500 transition-colors">
                <button type="submit"
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 font-bold text-white shadow-lg shadow-indigo-500/25 hover:scale-[1.02] transition-transform">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="appView" class="w-full hidden flex-col md:flex-row h-screen">
        <aside class="w-full md:w-72 glass-panel m-4 p-6 flex flex-col gap-6 shrink-0 h-auto md:h-[calc(100vh-32px)]">
            <h1 class="text-4xl font-black text-white tracking-tighter">Far<span class="text-indigo-400">del</span>.
            </h1>

            <nav class="flex flex-col gap-2 flex-1 mt-4">
                <a href="#" class="flex items-center gap-3 p-3 rounded-xl bg-white/10 text-white font-bold"><i
                        data-lucide="layout-dashboard" class="w-5 h-5"></i> Panel General</a>
                <button onclick="exportarCSV()"
                    class="flex items-center gap-3 p-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-left"><i
                        data-lucide="download-cloud" class="w-5 h-5"></i> Exportar CSV</button>
            </nav>

            <div class="mt-auto pt-6 border-t border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="img/avatar.png" alt="Perfil"
                            onerror="this.src='https://ui-avatars.com/api/?name=Giuseppe&background=6366f1&color=fff'"
                            class="w-10 h-10 rounded-full object-cover border border-white/20">
                        <div
                            class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-[#050505]">
                        </div>
                    </div>
                    <div>
                        <p id="userName" class="font-bold text-sm leading-tight text-white"></p>
                        <p class="text-xs text-gray-400">Admin</p>
                    </div>
                </div>
                <button onclick="cerrarSesion()" class="text-gray-500 hover:text-red-400 transition-colors p-2"><i
                        data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:py-4 md:pr-4 overflow-y-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div class="flex gap-1 glass-panel p-1.5 rounded-xl text-sm">
                    <button onclick="cargarDashboard('semana')" id="btn-semana"
                        class="px-5 py-2 rounded-lg text-gray-400 hover:text-white transition-colors">Semana</button>
                    <button onclick="cargarDashboard('mes')" id="btn-mes"
                        class="px-5 py-2 rounded-lg bg-white/10 text-white font-bold shadow-sm">Mes</button>
                    <button onclick="cargarDashboard('año')" id="btn-año"
                        class="px-5 py-2 rounded-lg text-gray-400 hover:text-white transition-colors">Año</button>
                </div>
                <div class="glass-panel px-6 py-4 rounded-2xl flex items-center gap-5">
                    <div
                        class="w-12 h-12 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs font-medium uppercase tracking-wider">Total Gastado</p>
                        <h2 class="text-3xl font-black text-white" id="totalGastos">0.00 €</h2>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div class="space-y-6">
                    <div class="glass-panel p-6">
                        <h3 class="font-bold text-lg mb-5 flex items-center gap-2 text-white"><i
                                data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i> Nuevo Gasto</h3>
                        <form id="formGasto" class="space-y-4">
                            <input type="text" id="gastoConcepto" placeholder="Concepto"
                                class="w-full p-4 rounded-xl bg-black/40 border border-white/10 text-sm outline-none focus:border-indigo-500 transition-colors text-white"
                                required>
                            <div class="flex gap-3">
                                <input type="number" id="gastoCantidad" placeholder="0.00 €" step="0.01"
                                    class="w-1/2 p-4 rounded-xl bg-black/40 border border-white/10 text-sm outline-none focus:border-indigo-500 transition-colors text-white"
                                    required>
                                <select id="gastoCategoria"
                                    class="w-1/2 p-4 rounded-xl bg-black/40 border border-white/10 text-sm outline-none focus:border-indigo-500 transition-colors text-white [&>option]:bg-[#111]"
                                    required></select>
                            </div>
                            <button type="submit"
                                class="w-full py-4 rounded-xl bg-indigo-600 font-bold text-white hover:bg-indigo-500 transition-colors">Registrar</button>
                        </form>
                    </div>

                    <div class="glass-panel p-6">
                        <h3 class="font-bold text-lg mb-5 flex items-center gap-2 text-white"><i
                                data-lucide="calendar-clock" class="w-5 h-5 text-pink-400"></i> Suscripciones</h3>
                        <div id="listaSuscripciones" class="space-y-3"></div>
                    </div>
                </div>

                <div class="glass-panel p-6">
                    <h3 class="font-bold text-lg mb-5 flex items-center gap-2 text-white"><i data-lucide="pie-chart"
                            class="w-5 h-5 text-purple-400"></i> Distribución</h3>
                    <div class="relative w-full h-64 flex justify-center items-center">
                        <canvas id="graficoGastos"></canvas>
                    </div>
                </div>

                <div class="glass-panel p-6 h-full min-h-[500px]">
                    <h3 class="font-bold text-lg mb-5 flex items-center gap-2 text-white"><i data-lucide="list"
                            class="w-5 h-5 text-blue-400"></i> Movimientos</h3>
                    <div class="space-y-3 overflow-y-auto max-h-[600px] pr-2" id="listaGastos"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
