<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>

    <script>
        function ejecutar() {
            var respuesta = document.getElementById("miDiv");
            for (i = 1; i < 10; i++) {
                respuesta.innerHTML += i;
                for (j = i - 1; j > 0; j--) {
                    respuesta.innerHTML += i;
                }
                respuesta.innerHTML += "<br>";
            }
        }
    </script>

</head>

<body onload=ejecutar()>
    <div id="miDiv"></div>
</body>

</html>
