<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Tema 3</title>

    <script>
        var array = [];
        var indice = 0;

        // ======================= Comprobar Valor ================================
        function comprobar(valor) {
            if (valor.trim() === "") return false;
            var numero = Number(valor);
            if (isNaN(numero)) {
                return false;
            }
            return numero;
        }
        // ========================================================================

        // ======================= NAVEGACIÓN =====================================
        function primera() {
            if (array.length > 0) {
                indice = 0;
                mostrarArray();
            }
        }

        function anterior() {
            if (indice > 0) {
                indice--;
                mostrarArray();
            }
        }

        function siguiente() {
            if (indice < array.length - 1) {
                indice++;
                mostrarArray();
            }
        }

        function ultima() {
            if (array.length > 0) {
                indice = array.length - 1;
                mostrarArray();
            }
        }
        // ========================================================================

        // ======================= DAR DE ALTA ====================================
        function alta() {
            var inputRecibido = document.getElementById('inputNumero').value;
            var errores = document.getElementById('error');

            errores.innerHTML = '';
            var numeroValido = comprobar(inputRecibido);

            if (numeroValido !== false) {
                array.push(numeroValido);
                indice = array.length - 1;
                mostrarArray();
            } else {
                errores.innerHTML = 'La cadena de caracteres contiene caracteres no numericos';
            }
        }
        // ========================================================================

        // ======================= DAR DE BAJA ====================================
        function baja() {
            var errores = document.getElementById('error');
            errores.innerHTML = '';

            if (array.length === 0) {
                errores.innerHTML = 'El array está vacío';
                return;
            }

            array.splice(indice, 1);
            if (indice >= array.length && indice > 0) {
                indice = array.length - 1;
            }
            mostrarArray();
        }
        // ========================================================================

        // ======================= MODIFICAR ARRAY ================================
        function modificacion() {
            var inputRecibido = document.getElementById('inputNumero').value;
            var errores = document.getElementById('error');
            errores.innerHTML = '';

            if (array.length === 0) {
                errores.innerHTML = 'El array está vacío';
                return;
            }

            var numeroValido = comprobar(inputRecibido);

            if (numeroValido !== false) {
                array[indice] = numeroValido;
                mostrarArray();
            } else {
                errores.innerHTML = 'La cadena de caracteres contiene caracteres no numericos';
            }
        }
        // ========================================================================

        // ======================= MOSTRAR ARRAY ==================================
        function mostrarArray() {
            var entrega = document.getElementById('respuesta');

            if (array.length === 0) {
                entrega.innerHTML = '';
                document.getElementById('inputNumero').value = "";
                return;
            }

            var copiaAsc = [...array].sort((a, b) => a - b);
            var copiaDesc = [...array].sort((a, b) => b - a);

            var html = array.join(',') + ' indice: ' + indice + ' posición: ' + (indice + 1) + '<br>';
            html += 'Ordenado Ascendente<br>' + copiaAsc.join(',') + '<br>';
            html += 'Ordenado Descendente<br>' + copiaDesc.join(',') + '<br>';

            entrega.innerHTML = html;
            document.getElementById('inputNumero').value = "";
        }
        // ========================================================================

        // ======================= LISTADO POPUP ==================================
        function abrirListado() {
            var ventana = window.open('', 'ListadoWindow', 'width=400,height=400');
            var doc = ventana.document;

            var copiaAsc = [...array].sort((a, b) => a - b);
            var copiaDesc = [...array].sort((a, b) => b - a);

            doc.title = "Listado Array de numeros";

            var titulo = doc.createElement("h3");
            titulo.textContent = "Listado Array de numeros";
            doc.body.appendChild(titulo);

            var tabla = doc.createElement("table");
            tabla.setAttribute("border", "1");

            var filaEncabezado = doc.createElement("tr");
            var th1 = doc.createElement("th"); th1.textContent = "Array";
            var th2 = doc.createElement("th"); th2.textContent = "Ascendente";
            var th3 = doc.createElement("th"); th3.textContent = "Descendente";

            filaEncabezado.appendChild(th1);
            filaEncabezado.appendChild(th2);
            filaEncabezado.appendChild(th3);
            tabla.appendChild(filaEncabezado);

            for (var i = 0; i < array.length; i++) {
                var fila = doc.createElement("tr");
                var td1 = doc.createElement("td"); td1.textContent = array[i];
                var td2 = doc.createElement("td"); td2.textContent = copiaAsc[i];
                var td3 = doc.createElement("td"); td3.textContent = copiaDesc[i];

                fila.appendChild(td1);
                fila.appendChild(td2);
                fila.appendChild(td3);
                tabla.appendChild(fila);
            }

            doc.body.appendChild(tabla);

            var salto = doc.createElement("br");
            doc.body.appendChild(salto);

            var botonCerrar = doc.createElement("button");
            botonCerrar.textContent = "Cerrar ventana";
            botonCerrar.onclick = function () {
                ventana.close();
            };
            doc.body.appendChild(botonCerrar);
        }
        // ========================================================================
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="todo">
        <div id="introducirDatos">
            <label id="nombreInputNumero">Número: </label>
            <input type="text" id="inputNumero" placeholder="introduce un número">
            <div id="error"></div>
        </div>

        <div id="navegador">
            <nav>
                <ul>
                    <li><input type="button" value="Primera" onclick="primera()"></li>
                    <li><input type="button" value="Anterior" onclick="anterior()"></li>
                    <li><input type="button" value="Siguiente" onclick="siguiente()"></li>
                    <li><input type="button" value="Última" onclick="ultima()"></li>
                    <li><input type="submit" value="Alta" onclick="alta()" autofocus></li>
                    <li><input type="button" value="Baja" onclick="baja()"></li>
                    <li><input type="button" value="Modificar" onclick="modificacion()"></li>
                    <li><input type="button" value="Listado" onclick="abrirListado()"></li>
                </ul>
            </nav>
        </div>

        <div id="respuesta"></div>
    </div>
</body>

</html>
