<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio J</title>
</head>
<body>
    <script>
        // j. Sumar 2 años a la variable "fecha85" y mostrarla.
        let fechaHoy = new Date();
        let fecha85 = new Date();
        fecha85.setDate(fechaHoy.getDate() + 85);
        
        fecha85.setFullYear(fecha85.getFullYear() + 2);
        document.write("j. " + fecha85);
    </script>
</body>
</html>
