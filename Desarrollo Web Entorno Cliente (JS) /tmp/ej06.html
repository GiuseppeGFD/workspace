<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>

<body>
    <div id="miDiv"></div>
    <script>
        var i = 1;
        var codigohtml = document.getElementById("miDiv");
        while (i < 7) {
            codigohtml.innerHTML += "<h" + i + ">cabeceranivel " + i + "</h" + i + ">";
            i++;
        }
        i = 6;
        do {
            codigohtml.innerHTML += "<h" + i + ">cabeceranivel " + i + "</h" + i + ">";
            i--;
        } while (i > 0);
    </script>
</body>

</html>
