<!DOCTYPE html>
<html>
 <body>
 <font face="arial">
 <div id="miDiv"></div>
 <script>
   var i;
   var texto =""
   for (i=1; i<=300; i++) {
     if ((i % 4) == 0) 
       texto+='<font color=green size=+4>'+i+'</font>';
     else if ((i % 9) == 0) 
       texto+='<font color=red size=-2>'+i+'</font>';
     else texto+=i;
     if ((i % 10) == 0) 
	 texto+='<br>';
   }
   document.getElementById("miDiv").innerHTML=texto;
 </script>
 </font>
 </body>
 </html>
