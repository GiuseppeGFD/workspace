<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function validar() {
            var aceptar = confirm("Realmente quiere salir?");
            texto = "El usuario ha pulsado ";
            if (aceptar == true) {
                texto += "Aceptar";
            }
            else {
                texto += "Cancelar";
            }
            document.getElementById("miDiv").innerHTML = texto;
        }
    </script>
</head>

<body>
    <input type="button" value="Aceptar" onclick="validar()" />
    <div id="miDiv"></div>
</body>

</html>
