<body>
    <div id="miDiv"></div>

    <script>
        var texto = "cadena = 'uno dos tres cuatro' aplicandole el método cadena.indexOf('dos') = ";
        cadena = "uno dos tres cuatro";
        posicionDeDos = cadena.indexOf("dos");

        // posicionDeDos = 4
        texto += " posicionDeDos = " + posicionDeDos;
        document.getElementById("miDiv").innerHTML = texto;
        /* for (var i = 0; i <= cadena.length - 1; i++) {
             texto += "<br>indice " + i + " caracter " + cadena.charAt(i);
         }*/
        document.getElementById("miDiv").innerHTML = texto;
        var cadenita = cadena.slice(4, 9);
        texto += "<br> cadena.slice(4,7) = " + cadenita;

        var trozos = cadena.split(" ");

        texto += "<br> mostrar trozos[3]" + trozos2[1];
